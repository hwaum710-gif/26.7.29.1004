<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>나의 진로 성장 포트폴리오</title>

  <style>
    /* =========================
       1. 기본 디자인 설정
       ========================= */
    :root {
      --navy: #17365d;
      --blue: #3568d4;
      --teal: #12a594;
      --yellow: #f4b942;
      --red: #e25454;
      --purple: #7857c7;
      --background: #f4f7fb;
      --surface: #ffffff;
      --line: #dce3ed;
      --text: #1f2937;
      --muted: #697586;
      --shadow: 0 10px 30px rgba(24, 54, 93, 0.09);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family:
        "Pretendard", "Noto Sans KR", "Malgun Gothic",
        Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .danger-text {
      color: var(--red);
    }

    .success-text {
      color: var(--teal);
    }

    /* =========================
       2. 공통 버튼과 입력 요소
       ========================= */
    .btn {
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .btn-primary {
      color: white;
      background: var(--blue);
    }

    .btn-teal {
      color: white;
      background: var(--teal);
    }

    .btn-light {
      color: var(--navy);
      background: #edf3fb;
    }

    .btn-danger {
      color: white;
      background: var(--red);
    }

    .btn-full {
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(53, 104, 212, 0.12);
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    /* =========================
       3. 로그인 화면
       ========================= */
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, #d9fbf5 0, transparent 27%),
        radial-gradient(circle at 80% 10%, #dce8ff 0, transparent 30%),
        linear-gradient(135deg, #f6fbff, #f5f7ff);
    }

    .login-card {
      width: min(100%, 470px);
      padding: 34px;
      border-radius: 24px;
      background: white;
      box-shadow: var(--shadow);
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      font-size: 29px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 28px;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 24px 0 18px;
      padding: 5px;
      border-radius: 14px;
      background: #eef3f8;
    }

    .role-tab {
      padding: 11px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
    }

    .role-tab.active {
      color: white;
      background: var(--blue);
    }

    .login-help {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      color: #466079;
      background: #f3f8fc;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       4. 앱 레이아웃
       ========================= */
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 245px 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      color: white;
      background: var(--navy);
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 8px 10px 24px;
    }

    .sidebar-brand strong {
      display: block;
      font-size: 19px;
      line-height: 1.4;
    }

    .sidebar-brand span {
      color: #b9cae0;
      font-size: 12px;
    }

    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      padding: 12px 13px;
      border: 0;
      border-radius: 12px;
      color: #d9e5f3;
      background: transparent;
      text-align: left;
      font-weight: 800;
    }

    .nav-button:hover,
    .nav-button.active {
      color: white;
      background: rgba(255, 255, 255, 0.14);
    }

    .sidebar-footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .main {
      min-width: 0;
      padding: 26px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }

    .topbar h2 {
      margin: 0 0 5px;
      color: var(--navy);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border-radius: 14px;
      background: white;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--teal);
      font-weight: 900;
    }

    /* =========================
       5. 카드와 대시보드
       ========================= */
    .card {
      padding: 21px;
      border: 1px solid #edf0f4;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 14px;
      color: var(--navy);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 18px;
      border-radius: 17px;
      background: white;
      box-shadow: var(--shadow);
    }

    .stat-card .number {
      margin-top: 8px;
      color: var(--navy);
      font-size: 28px;
      font-weight: 900;
    }

    .stat-card.total {
      border-top: 5px solid var(--navy);
    }

    .stat-card.job {
      border-top: 5px solid var(--blue);
    }

    .stat-card.major {
      border-top: 5px solid var(--teal);
    }

    .stat-card.school {
      border-top: 5px solid var(--yellow);
    }

    .stat-card.activity {
      border-top: 5px solid var(--purple);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 18px;
    }

    .week-track {
      display: grid;
      grid-template-columns: repeat(17, minmax(26px, 1fr));
      gap: 5px;
      margin-top: 14px;
    }

    .week {
      display: grid;
      place-items: center;
      min-height: 36px;
      border-radius: 9px;
      color: var(--muted);
      background: #edf1f6;
      font-size: 11px;
      font-weight: 900;
    }

    .week.done {
      color: white;
      background: var(--teal);
    }

    .week.current {
      color: white;
      background: var(--blue);
      outline: 3px solid rgba(53, 104, 212, 0.17);
    }

    .category-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .category-action {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--navy);
      background: white;
      text-align: left;
      font-weight: 900;
    }

    .category-action:hover {
      border-color: var(--blue);
      background: #f5f8ff;
    }

    /* =========================
       6. 누적 기록 및 타임라인
       ========================= */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .section-header h2,
    .section-header h3 {
      margin: 0;
      color: var(--navy);
    }

    .record-list {
      display: grid;
      gap: 14px;
    }

    .record-card {
      position: relative;
      padding: 20px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--blue);
      border-radius: 15px;
      background: white;
    }

    .record-card[data-category="major"] {
      border-left-color: var(--teal);
    }

    .record-card[data-category="highschool"],
    .record-card[data-category="university"] {
      border-left-color: var(--yellow);
    }

    .record-card[data-category="activity"] {
      border-left-color: var(--purple);
    }

    .record-card h3 {
      margin: 5px 0 9px;
    }

    .record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      color: #27415b;
      background: #edf3f8;
      font-size: 12px;
      font-weight: 900;
    }

    .record-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .feedback-box {
      margin-top: 13px;
      padding: 12px;
      border-radius: 12px;
      color: #38526a;
      background: #edf9f7;
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-state {
      padding: 45px 20px;
      border: 2px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      background: white;
      text-align: center;
    }

    /* =========================
       7. 한눈에 보기
       ========================= */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 105px 1fr 35px;
      align-items: center;
      gap: 10px;
      margin: 13px 0;
    }

    .bar-track {
      height: 13px;
      border-radius: 99px;
      background: #e8edf4;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--blue), var(--teal));
    }

    .timeline {
      position: relative;
      padding-left: 25px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 7px;
      width: 3px;
      border-radius: 4px;
      background: #dce4ee;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 17px;
      padding: 15px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      top: 18px;
      left: -24px;
      width: 12px;
      height: 12px;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 2px var(--blue);
    }

    .insight {
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #edf4ff, #edfdf9);
    }

    /* =========================
       8. 교사 관리 화면
       ========================= */
    .teacher-layout {
      display: grid;
      grid-template-columns: 1fr 0.95fr;
      gap: 18px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--navy);
      background: #f1f5f9;
      font-size: 13px;
    }

    tr:hover td {
      background: #f8fbff;
    }

    .selected-row td {
      background: #edf4ff !important;
    }

    /* =========================
       9. 모달
       ========================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(14, 29, 50, 0.56);
    }

    .modal {
      width: min(760px, 100%);
      max-height: 92vh;
      padding: 24px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--navy);
    }

    .close-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      color: var(--navy);
      background: #edf2f7;
      font-size: 20px;
    }

    /* =========================
       10. 알림 메시지
       ========================= */
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      min-width: 260px;
      padding: 14px 18px;
      border-radius: 13px;
      color: white;
      background: var(--navy);
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    /* =========================
       11. 반응형 화면
       ========================= */
    @media (max-width: 1050px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .dashboard-grid,
      .teacher-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .app {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .sidebar-brand {
        padding-bottom: 14px;
      }

      .sidebar nav {
        display: flex;
        gap: 7px;
        overflow-x: auto;
      }

      .nav-button {
        min-width: max-content;
      }

      .sidebar-footer {
        margin-top: 10px;
      }

      .main {
        padding: 17px;
      }

      .stats-grid,
      .overview-grid,
      .form-grid,
      .category-actions {
        grid-template-columns: 1fr;
      }

      .week-track {
        grid-template-columns: repeat(9, 1fr);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media print {
      .sidebar,
      .topbar button,
      .record-actions,
      .screen-actions {
        display: none !important;
      }

      .app {
        display: block;
      }

      .main {
        padding: 0;
      }

      .card,
      .record-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <!-- =========================
       로그인 화면
       ========================= -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">🧭</div>
      <h1>나의 진로 성장 포트폴리오</h1>
      <p class="muted">
        탐색하고, 기록하고, 나의 변화를 발견해 보세요.
      </p>

      <div class="role-tabs">
        <button
          id="studentRoleButton"
          class="role-tab active"
          type="button"
          onclick="setLoginRole('student')"
        >
          학생 로그인
        </button>

        <button
          id="teacherRoleButton"
          class="role-tab"
          type="button"
          onclick="setLoginRole('teacher')"
        >
          교사 로그인
        </button>
      </div>

      <form id="loginForm" onsubmit="login(event)">
        <div class="form-group">
          <label for="loginId">아이디</label>
          <input
            id="loginId"
            type="text"
            autocomplete="username"
            placeholder="예: 1-1-01"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">비밀번호</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="비밀번호를 입력하세요"
            required
          >
        </div>

        <div class="form-group">
          <label>
            <input
              id="showPassword"
              type="checkbox"
              style="width:auto;"
              onchange="togglePassword()"
            >
            비밀번호 보기
          </label>
        </div>

        <button class="btn btn-primary btn-full" type="submit">
          로그인
        </button>
      </form>

      <div class="login-help">
        <strong>학생 아이디 규칙</strong><br>
        학년-반-번호로 구성됩니다. 예: 1학년 1반 1번은
        <strong>1-1-01</strong>입니다.<br>
        최초 비밀번호는 <strong>1234</strong>이며, 교사가 언제든지
        초기화할 수 있습니다.
      </div>

      <p id="loginMessage" class="danger-text small"></p>
    </div>
  </section>

  <!-- =========================
       로그인 이후 앱 화면
       ========================= -->
  <div id="appScreen" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong>🧭 진로 성장 포트폴리오</strong>
        <span>중학교 1학년 · 17주 프로젝트</span>
      </div>

      <nav id="studentNavigation">
        <button class="nav-button active" data-view="dashboard">
          🏠 나의 홈
        </button>
        <button class="nav-button" data-view="job">
          💼 직업 탐색
        </button>
        <button class="nav-button" data-view="major">
          📚 학과 탐색
        </button>
        <button class="nav-button" data-view="highschool">
          🏫 고등학교 탐색
        </button>
        <button class="nav-button" data-view="university">
          🎓 대학교 탐색
        </button>
        <button class="nav-button" data-view="activity">
          🌱 진로 체험·활동
        </button>
        <button class="nav-button" data-view="overview">
          📊 성장 한눈에 보기
        </button>
        <button class="nav-button" data-view="timeline">
          🗂️ 전체 포트폴리오
        </button>
      </nav>

      <nav id="teacherNavigation" class="hidden">
        <button class="nav-button active" data-view="teacher">
          📋 학생 관리
        </button>
        <button class="nav-button" data-view="teacherOverview">
          📈 학급 현황
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-button" type="button" onclick="logout()">
          🚪 로그아웃
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">나의 진로 포트폴리오</h2>
          <div id="pageSubtitle" class="muted">
            오늘의 관심을 미래의 기록으로 남겨 보세요.
          </div>
        </div>

        <div class="user-chip">
          <div id="userAvatar" class="avatar">학</div>
          <div>
            <strong id="userName">학생</strong>
            <div id="userRoleText" class="small muted">학생</div>
          </div>
        </div>
      </header>

      <section id="viewContainer"></section>
    </main>
  </div>

  <!-- =========================
       기록 작성·수정 모달
       ========================= -->
  <div id="recordModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="recordModalTitle">새 기록 추가</h2>
        <button
          class="close-button"
          type="button"
          onclick="closeRecordModal()"
          aria-label="닫기"
        >
          ×
        </button>
      </div>

      <form id="recordForm" onsubmit="saveRecord(event)">
        <input id="recordId" type="hidden">
        <input id="recordCategory" type="hidden">

        <div class="form-grid">
          <div>
            <label for="recordTitle">기록 제목</label>
            <input
              id="recordTitle"
              type="text"
              placeholder="직업명, 학과명, 학교명 또는 활동명"
              required
            >
          </div>

          <div>
            <label for="recordDate">기록 날짜</label>
            <input id="recordDate" type="date" required>
          </div>

          <div>
            <label for="recordWeek">활동 주차</label>
            <select id="recordWeek"></select>
          </div>

          <div>
            <label for="recordInterest">관심도</label>
            <select id="recordInterest">
              <option value="1">⭐</option>
              <option value="2">⭐⭐</option>
              <option value="3" selected>⭐⭐⭐</option>
              <option value="4">⭐⭐⭐⭐</option>
              <option value="5">⭐⭐⭐⭐⭐</option>
            </select>
          </div>

          <div class="wide">
            <label for="recordInfo">탐색하거나 활동한 내용</label>
            <textarea
              id="recordInfo"
              placeholder="하는 일, 학과 특징, 학교 정보, 체험 내용 등을 기록하세요."
              required
            ></textarea>
          </div>

          <div class="wide">
            <label for="recordLearning">새롭게 알게 된 점</label>
            <textarea
              id="recordLearning"
              placeholder="이번 탐색을 통해 무엇을 새롭게 알게 되었나요?"
            ></textarea>
          </div>

          <div class="wide">
            <label for="recordReflection">나의 생각과 진로 연결</label>
            <textarea
              id="recordReflection"
              placeholder="나와 잘 맞는 점, 관심이 생긴 이유, 더 알아볼 점을 써 보세요."
            ></textarea>
          </div>

          <div class="wide">
            <label for="recordNext">다음에 실천하거나 찾아볼 일</label>
            <textarea
              id="recordNext"
              placeholder="다음 탐색 계획이나 실천할 일을 적어 보세요."
            ></textarea>
          </div>
        </div>

        <div
          style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;"
        >
          <button
            class="btn btn-light"
            type="button"
            onclick="closeRecordModal()"
          >
            취소
          </button>
          <button class="btn btn-primary" type="submit">
            기록 저장
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    /* =====================================================
       1. 앱에서 사용하는 기본 상수
       ===================================================== */
    const STORAGE_KEY = "careerPortfolioSingleFileV1";

    const CATEGORY_INFO = {
      job: {
        name: "직업 탐색",
        icon: "💼"
      },
      major: {
        name: "학과 탐색",
        icon: "📚"
      },
      highschool: {
        name: "고등학교 탐색",
        icon: "🏫"
      },
      university: {
        name: "대학교 탐색",
        icon: "🎓"
      },
      activity: {
        name: "진로 체험·활동",
        icon: "🌱"
      }
    };

    let state = loadState();
    let currentUser = null;
    let loginRole = "student";
    let currentView = "dashboard";
    let teacherSelectedStudentId = "1-1-01";

    /* =====================================================
       2. 최초 데이터 생성
       - 5개 학급, 학급당 25명의 학생 계정을 자동 생성합니다.
       ===================================================== */
    function createInitialState() {
      const students = [];

      for (let classNumber = 1; classNumber <= 5; classNumber++) {
        for (let number = 1; number <= 25; number++) {
          const paddedNumber = String(number).padStart(2, "0");
          const id = `1-${classNumber}-${paddedNumber}`;

          students.push({
            id,
            password: "1234",
            name: `1학년 ${classNumber}반 ${number}번`,
            classNumber,
            number,
            records: []
          });
        }
      }

      /* 첫 번째 학생에게 화면 확인용 예시 기록을 제공합니다. */
      const sampleStudent = students.find(student => student.id === "1-1-01");

      sampleStudent.name = "김하늘";
      sampleStudent.records = [
        {
          id: makeId(),
          category: "job",
          title: "웹 개발자",
          date: "2026-03-12",
          week: 2,
          interest: 4,
          info: "웹사이트와 웹 서비스를 기획하고 프로그램을 만드는 직업이다.",
          learning: "화면 디자인뿐 아니라 데이터와 서버에 대한 이해도 필요하다.",
          reflection: "문제를 해결하고 결과물을 만드는 활동이 나와 잘 맞을 것 같다.",
          next: "간단한 HTML 페이지를 직접 만들어 본다.",
          feedback: "관심을 가진 이유가 잘 드러납니다. 필요한 역량도 더 찾아보세요."
        },
        {
          id: makeId(),
          category: "major",
          title: "컴퓨터공학과",
          date: "2026-03-26",
          week: 4,
          interest: 4,
          info: "컴퓨터 시스템, 프로그래밍, 인공지능, 네트워크 등을 공부한다.",
          learning: "수학적 사고력과 문제 해결 능력이 중요하다는 것을 알았다.",
          reflection: "프로그램을 만드는 것에 관심이 있어 더 탐색하고 싶다.",
          next: "관련 대학의 교육과정을 비교해 본다.",
          feedback: ""
        },
        {
          id: makeId(),
          category: "activity",
          title: "진로 흥미 검사",
          date: "2026-04-09",
          week: 6,
          interest: 3,
          info: "진로 흥미 검사를 실시하고 결과를 분석했다.",
          learning: "탐구형과 예술형 분야에 관심이 높게 나타났다.",
          reflection: "좋아하는 것과 잘하는 것을 함께 생각해야 한다.",
          next: "탐구형과 관련된 직업을 세 가지 더 찾아본다.",
          feedback: "검사 결과를 직업 탐색과 연결해 보세요."
        }
      ];

      return {
        teacher: {
          id: "teacher",
          password: "teacher1234",
          name: "진로 담당 교사"
        },
        students
      };
    }

    /* =====================================================
       3. 브라우저 저장소 관리
       ===================================================== */
    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (error) {
          console.error("저장 데이터를 읽는 데 실패했습니다.", error);
        }
      }

      const initialState = createInitialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initialState));
      return initialState;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function makeId() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    /* =====================================================
       4. 로그인 관련 기능
       ===================================================== */
    function setLoginRole(role) {
      loginRole = role;

      document
        .getElementById("studentRoleButton")
        .classList.toggle("active", role === "student");

      document
        .getElementById("teacherRoleButton")
        .classList.toggle("active", role === "teacher");

      document.getElementById("loginId").placeholder =
        role === "student" ? "예: 1-1-01" : "교사 아이디";

      document.getElementById("loginMessage").textContent = "";
    }

    function togglePassword() {
      const input = document.getElementById("loginPassword");
      input.type = input.type === "password" ? "text" : "password";
    }

    function login(event) {
      event.preventDefault();

      const id = document.getElementById("loginId").value.trim();
      const password = document.getElementById("loginPassword").value;
      const message = document.getElementById("loginMessage");

      if (loginRole === "student") {
        const student = state.students.find(item => item.id === id);

        if (!student || student.password !== password) {
          message.textContent =
            "아이디 또는 비밀번호가 맞지 않습니다. 선생님께 초기화를 요청하세요.";
          return;
        }

        currentUser = {
          role: "student",
          ...student
        };

        currentView = "dashboard";
      } else {
        if (
          id !== state.teacher.id ||
          password !== state.teacher.password
        ) {
          message.textContent = "교사 아이디 또는 비밀번호가 맞지 않습니다.";
          return;
        }

        currentUser = {
          role: "teacher",
          ...state.teacher
        };

        currentView = "teacher";
      }

      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");

      configureAppForUser();
      renderCurrentView();
    }

    function logout() {
      currentUser = null;
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("loginForm").reset();
      document.getElementById("loginMessage").textContent = "";
    }

    function configureAppForUser() {
      const isStudent = currentUser.role === "student";

      document
        .getElementById("studentNavigation")
        .classList.toggle("hidden", !isStudent);

      document
        .getElementById("teacherNavigation")
        .classList.toggle("hidden", isStudent);

      document.getElementById("userName").textContent = currentUser.name;
      document.getElementById("userRoleText").textContent =
        isStudent ? `${currentUser.id} · 학생` : "교사 관리자";

      document.getElementById("userAvatar").textContent =
        isStudent ? currentUser.name.charAt(0) : "교";

      bindNavigation();
    }

    function bindNavigation() {
      document.querySelectorAll(".nav-button[data-view]").forEach(button => {
        button.onclick = () => {
          currentView = button.dataset.view;

          document
            .querySelectorAll(".nav-button[data-view]")
            .forEach(item => item.classList.remove("active"));

          button.classList.add("active");
          renderCurrentView();
        };
      });
    }

    /* =====================================================
       5. 화면 전환
       ===================================================== */
    function renderCurrentView() {
      if (!currentUser) return;

      if (currentUser.role === "student") {
        const student = getCurrentStudent();

        if (currentView === "dashboard") {
          renderStudentDashboard(student);
        } else if (CATEGORY_INFO[currentView]) {
          renderCategoryPage(student, currentView);
        } else if (currentView === "overview") {
          renderOverview(student);
        } else if (currentView === "timeline") {
          renderTimeline(student);
        }
      } else {
        if (currentView === "teacherOverview") {
          renderTeacherOverview();
        } else {
          renderTeacherDashboard();
        }
      }
    }

    function setPageHeader(title, subtitle) {
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = subtitle;
    }

    function getCurrentStudent() {
      return state.students.find(student => student.id === currentUser.id);
    }

    function countByCategory(student, category) {
      return student.records.filter(record => record.category === category).length;
    }

    /* =====================================================
       6. 학생 대시보드
       ===================================================== */
    function renderStudentDashboard(student) {
      setPageHeader(
        `${student.name}님의 진로 포트폴리오`,
        "17주 동안 쌓이는 나의 진로 성장 기록입니다."
      );

      const counts = {
        job: countByCategory(student, "job"),
        major: countByCategory(student, "major"),
        school:
          countByCategory(student, "highschool") +
          countByCategory(student, "university"),
        activity: countByCategory(student, "activity")
      };

      const latestRecords = [...student.records]
        .sort((a, b) => b.date.localeCompare(a.date))
        .slice(0, 3);

      document.getElementById("viewContainer").innerHTML = `
        <div class="stats-grid">
          ${statCard("전체 기록", student.records.length, "total")}
          ${statCard("직업", counts.job, "job")}
          ${statCard("학과", counts.major, "major")}
          ${statCard("학교", counts.school, "school")}
          ${statCard("체험·활동", counts.activity, "activity")}
        </div>

        <div class="card" style="margin-bottom:18px;">
          <h3>🗓️ 17주 성장 과정</h3>
          <p class="muted small">
            기록이 있는 주차는 초록색으로 표시됩니다.
          </p>
          <div class="week-track">
            ${renderWeekTrack(student)}
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="section-header">
              <h3>최근 누적 기록</h3>
              <button
                class="btn btn-light"
                type="button"
                onclick="goToView('timeline')"
              >
                전체 보기
              </button>
            </div>

            <div class="record-list">
              ${
                latestRecords.length
                  ? latestRecords.map(record => compactRecord(record)).join("")
                  : emptyState("아직 작성한 기록이 없습니다.")
              }
            </div>
          </div>

          <div class="card">
            <h3>✍️ 새 기록 추가</h3>
            <p class="muted small">
              기존 기록은 사라지지 않고 계속 누적됩니다.
            </p>

            <div class="category-actions">
              ${Object.entries(CATEGORY_INFO).map(([key, info]) => `
                <button
                  class="category-action"
                  type="button"
                  onclick="openRecordModal('${key}')"
                >
                  ${info.icon}<br>${info.name}
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function statCard(label, number, className) {
      return `
        <div class="stat-card ${className}">
          <div class="muted small">${escapeHtml(label)}</div>
          <div class="number">${number}</div>
        </div>
      `;
    }

    function renderWeekTrack(student) {
      const completedWeeks = new Set(
        student.records.map(record => Number(record.week))
      );

      return Array.from({ length: 17 }, (_, index) => {
        const week = index + 1;
        const className = completedWeeks.has(week) ? "done" : "";

        return `
          <div class="week ${className}" title="${week}주차">
            ${week}주
          </div>
        `;
      }).join("");
    }

    /* =====================================================
       7. 파트별 누적 기록 화면
       ===================================================== */
    function renderCategoryPage(student, category) {
      const info = CATEGORY_INFO[category];

      setPageHeader(
        `${info.icon} ${info.name}`,
        "기존 자료를 덮어쓰지 않고 새로운 탐색 기록을 계속 추가합니다."
      );

      const records = student.records
        .filter(record => record.category === category)
        .sort((a, b) => b.date.localeCompare(a.date));

      document.getElementById("viewContainer").innerHTML = `
        <div class="card">
          <div class="section-header">
            <div>
              <h2>${info.name} 누적 기록</h2>
              <p class="muted small">
                현재까지 총 <strong>${records.length}개</strong>의 기록이 쌓였습니다.
              </p>
            </div>

            <button
              class="btn btn-primary"
              type="button"
              onclick="openRecordModal('${category}')"
            >
              ＋ 새 기록 추가
            </button>
          </div>

          <div class="record-list">
            ${
              records.length
                ? records.map(record => fullRecordCard(record, true)).join("")
                : emptyState(`${info.name} 기록을 처음으로 작성해 보세요.`)
            }
          </div>
        </div>
      `;
    }

    function compactRecord(record) {
      const info = CATEGORY_INFO[record.category];

      return `
        <div class="record-card" data-category="${record.category}">
          <div class="record-meta">
            <span class="badge">${info.icon} ${info.name}</span>
            <span class="badge">${record.week}주차</span>
            <span class="badge">${escapeHtml(record.date)}</span>
          </div>
          <h3>${escapeHtml(record.title)}</h3>
          <p class="muted">${escapeHtml(shorten(record.reflection || record.info, 90))}</p>
        </div>
      `;
    }

    function fullRecordCard(record, showActions = false) {
      const info = CATEGORY_INFO[record.category];

      return `
        <article class="record-card" data-category="${record.category}">
          <div class="record-meta">
            <span class="badge">${info.icon} ${info.name}</span>
            <span class="badge">${record.week}주차</span>
            <span class="badge">${escapeHtml(record.date)}</span>
            <span class="badge">${"⭐".repeat(Number(record.interest || 0))}</span>
          </div>

          <h3>${escapeHtml(record.title)}</h3>

          <p><strong>탐색·활동 내용</strong><br>
            ${formatText(record.info)}
          </p>

          ${
            record.learning
              ? `<p><strong>새롭게 알게 된 점</strong><br>${formatText(record.learning)}</p>`
              : ""
          }

          ${
            record.reflection
              ? `<p><strong>나의 생각과 진로 연결</strong><br>${formatText(record.reflection)}</p>`
              : ""
          }

          ${
            record.next
              ? `<p><strong>다음 계획</strong><br>${formatText(record.next)}</p>`
              : ""
          }

          ${
            record.feedback
              ? `
                <div class="feedback-box">
                  <strong>💬 선생님 피드백</strong><br>
                  ${formatText(record.feedback)}
                </div>
              `
              : ""
          }

          ${
            showActions
              ? `
                <div class="record-actions">
                  <button
                    class="btn btn-light"
                    type="button"
                    onclick="editRecord('${record.id}')"
                  >
                    수정
                  </button>
                  <button
                    class="btn btn-danger"
                    type="button"
                    onclick="deleteRecord('${record.id}')"
                  >
                    삭제
                  </button>
                </div>
              `
              : ""
          }
        </article>
      `;
    }

    /* =====================================================
       8. 성장 한눈에 보기
       ===================================================== */
    function renderOverview(student) {
      setPageHeader(
        "📊 성장 한눈에 보기",
        "파트별 누적 현황과 나의 진로 탐색 흐름을 확인합니다."
      );

      const categoryCounts = Object.keys(CATEGORY_INFO).map(key => ({
        key,
        name: CATEGORY_INFO[key].name,
        count: countByCategory(student, key)
      }));

      const maxCount = Math.max(
        1,
        ...categoryCounts.map(item => item.count)
      );

      const mostExplored = [...categoryCounts]
        .sort((a, b) => b.count - a.count)[0];

      const latestRecords = [...student.records]
        .sort((a, b) => b.date.localeCompare(a.date))
        .slice(0, 8);

      document.getElementById("viewContainer").innerHTML = `
        <div class="stats-grid">
          ${statCard("총 누적 기록", student.records.length, "total")}
          ${statCard("기록한 주차", new Set(student.records.map(r => r.week)).size, "job")}
          ${statCard("직업 탐색", countByCategory(student, "job"), "major")}
          ${statCard("학교 탐색", countByCategory(student, "highschool") + countByCategory(student, "university"), "school")}
          ${statCard("체험 활동", countByCategory(student, "activity"), "activity")}
        </div>

        <div class="overview-grid">
          <div class="card">
            <h3>파트별 누적 기록</h3>

            ${categoryCounts.map(item => {
              const percent = Math.round((item.count / maxCount) * 100);

              return `
                <div class="bar-row">
                  <span>${escapeHtml(item.name)}</span>
                  <div class="bar-track">
                    <div
                      class="bar-fill"
                      style="width:${percent}%;"
                    ></div>
                  </div>
                  <strong>${item.count}</strong>
                </div>
              `;
            }).join("")}
          </div>

          <div class="card">
            <h3>나의 진로 탐색 특징</h3>

            <div class="insight">
              <strong>가장 많이 탐색한 영역</strong>
              <p>
                ${
                  student.records.length
                    ? `${CATEGORY_INFO[mostExplored.key].icon} ${mostExplored.name}`
                    : "아직 분석할 기록이 없습니다."
                }
              </p>

              <strong>성장 제안</strong>
              <p class="muted">
                ${
                  student.records.length
                    ? "기록이 적은 영역도 탐색하면 직업·학과·학교·활동의 연결 관계를 더 잘 이해할 수 있습니다."
                    : "첫 번째 진로 탐색 기록을 작성해 보세요."
                }
              </p>
            </div>

            <div class="screen-actions" style="margin-top:14px;">
              <button
                class="btn btn-light"
                type="button"
                onclick="window.print()"
              >
                포트폴리오 인쇄
              </button>
              <button
                class="btn btn-teal"
                type="button"
                onclick="exportMyData()"
              >
                내 기록 저장
              </button>
            </div>
          </div>

          <div class="card" style="grid-column:1 / -1;">
            <h3>나의 최근 진로 여정</h3>
            <div class="timeline">
              ${
                latestRecords.length
                  ? latestRecords.map(record => `
                    <div class="timeline-item">
                      <strong>
                        ${CATEGORY_INFO[record.category].icon}
                        ${escapeHtml(record.title)}
                      </strong>
                      <div class="small muted">
                        ${record.week}주차 · ${escapeHtml(record.date)}
                        · ${CATEGORY_INFO[record.category].name}
                      </div>
                      <p>${escapeHtml(shorten(record.reflection || record.info, 120))}</p>
                    </div>
                  `).join("")
                  : emptyState("기록이 쌓이면 진로 여정이 시간순으로 나타납니다.")
              }
            </div>
          </div>
        </div>
      `;
    }

    /* =====================================================
       9. 전체 통합 포트폴리오
       ===================================================== */
    function renderTimeline(student) {
      setPageHeader(
        "🗂️ 전체 포트폴리오",
        "직업·학과·학교·체험 기록을 시간순으로 한눈에 확인합니다."
      );

      const records = [...student.records]
        .sort((a, b) => {
          if (a.week !== b.week) return b.week - a.week;
          return b.date.localeCompare(a.date);
        });

      document.getElementById("viewContainer").innerHTML = `
        <div class="card">
          <div class="section-header">
            <div>
              <h2>나의 진로 여정</h2>
              <p class="muted small">
                총 ${records.length}개의 누적 기록
              </p>
            </div>

            <div class="screen-actions">
              <button
                class="btn btn-light"
                type="button"
                onclick="window.print()"
              >
                인쇄
              </button>
              <button
                class="btn btn-primary"
                type="button"
                onclick="openRecordModal('job')"
              >
                새 기록
              </button>
            </div>
          </div>

          <div class="record-list">
            ${
              records.length
                ? records.map(record => fullRecordCard(record, true)).join("")
                : emptyState("아직 포트폴리오 기록이 없습니다.")
            }
          </div>
        </div>
      `;
    }

    /* =====================================================
       10. 기록 추가·수정·삭제
       ===================================================== */
    function populateWeekOptions() {
      const select = document.getElementById("recordWeek");

      select.innerHTML = Array.from({ length: 17 }, (_, index) => {
        const week = index + 1;
        return `<option value="${week}">${week}주차</option>`;
      }).join("");
    }

    function openRecordModal(category, record = null) {
      populateWeekOptions();

      document.getElementById("recordModalTitle").textContent =
        record
          ? `${CATEGORY_INFO[category].name} 기록 수정`
          : `${CATEGORY_INFO[category].name} 새 기록`;

      document.getElementById("recordId").value = record?.id || "";
      document.getElementById("recordCategory").value = category;
      document.getElementById("recordTitle").value = record?.title || "";
      document.getElementById("recordDate").value =
        record?.date || new Date().toISOString().slice(0, 10);
      document.getElementById("recordWeek").value = record?.week || 1;
      document.getElementById("recordInterest").value =
        record?.interest || 3;
      document.getElementById("recordInfo").value = record?.info || "";
      document.getElementById("recordLearning").value =
        record?.learning || "";
      document.getElementById("recordReflection").value =
        record?.reflection || "";
      document.getElementById("recordNext").value = record?.next || "";

      document.getElementById("recordModal").classList.remove("hidden");
    }

    function closeRecordModal() {
      document.getElementById("recordModal").classList.add("hidden");
      document.getElementById("recordForm").reset();
    }

    function saveRecord(event) {
      event.preventDefault();

      const student = getCurrentStudent();
      const recordId = document.getElementById("recordId").value;

      const newRecord = {
        id: recordId || makeId(),
        category: document.getElementById("recordCategory").value,
        title: document.getElementById("recordTitle").value.trim(),
        date: document.getElementById("recordDate").value,
        week: Number(document.getElementById("recordWeek").value),
        interest: Number(document.getElementById("recordInterest").value),
        info: document.getElementById("recordInfo").value.trim(),
        learning: document.getElementById("recordLearning").value.trim(),
        reflection: document.getElementById("recordReflection").value.trim(),
        next: document.getElementById("recordNext").value.trim(),
        feedback: ""
      };

      if (recordId) {
        const index = student.records.findIndex(record => record.id === recordId);

        /* 기존 교사 피드백이 사라지지 않도록 보존합니다. */
        newRecord.feedback = student.records[index].feedback || "";
        student.records[index] = newRecord;
      } else {
        student.records.push(newRecord);
      }

      saveState();
      closeRecordModal();
      renderCurrentView();
      showToast(recordId ? "기록이 수정되었습니다." : "새 기록이 누적되었습니다.");
    }

    function editRecord(recordId) {
      const student = getCurrentStudent();
      const record = student.records.find(item => item.id === recordId);

      if (record) {
        openRecordModal(record.category, record);
      }
    }

    function deleteRecord(recordId) {
      if (!confirm("이 기록을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다.")) {
        return;
      }

      const student = getCurrentStudent();
      student.records = student.records.filter(record => record.id !== recordId);

      saveState();
      renderCurrentView();
      showToast("기록이 삭제되었습니다.");
    }

    /* =====================================================
       11. 교사 관리 대시보드
       ===================================================== */
    function renderTeacherDashboard() {
      setPageHeader(
        "📋 교사 관리",
        "학급별 작성 현황을 확인하고 학생 기록에 피드백할 수 있습니다."
      );

      const selectedStudent =
        state.students.find(student => student.id === teacherSelectedStudentId) ||
        state.students[0];

      const classNumber = selectedStudent.classNumber;

      const classStudents = state.students.filter(
        student => student.classNumber === classNumber
      );

      document.getElementById("viewContainer").innerHTML = `
        <div class="card" style="margin-bottom:18px;">
          <div class="section-header">
            <h3>학급 선택</h3>
            <select
              style="width:160px;"
              onchange="changeTeacherClass(this.value)"
            >
              ${[1, 2, 3, 4, 5].map(number => `
                <option
                  value="${number}"
                  ${number === classNumber ? "selected" : ""}
                >
                  1학년 ${number}반
                </option>
              `).join("")}
            </select>
          </div>
        </div>

        <div class="teacher-layout">
          <div class="card">
            <h3>1학년 ${classNumber}반 학생 현황</h3>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>번호</th>
                    <th>학생</th>
                    <th>총 기록</th>
                    <th>최근 작성</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody>
                  ${classStudents.map(student => {
                    const latest = [...student.records]
                      .sort((a, b) => b.date.localeCompare(a.date))[0];

                    return `
                      <tr class="${student.id === selectedStudent.id ? "selected-row" : ""}">
                        <td>${student.number}</td>
                        <td>${escapeHtml(student.name)}</td>
                        <td>${student.records.length}</td>
                        <td>${latest ? escapeHtml(latest.date) : "미작성"}</td>
                        <td>
                          <button
                            class="btn btn-light"
                            type="button"
                            onclick="selectTeacherStudent('${student.id}')"
                          >
                            보기
                          </button>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="section-header">
              <div>
                <h3>${escapeHtml(selectedStudent.name)}</h3>
                <span class="muted small">${selectedStudent.id}</span>
              </div>

              <button
                class="btn btn-danger"
                type="button"
                onclick="resetStudentPassword('${selectedStudent.id}')"
              >
                비밀번호 초기화
              </button>
            </div>

            <p>
              누적 기록:
              <strong>${selectedStudent.records.length}개</strong>
            </p>

            <div class="record-list">
              ${
                selectedStudent.records.length
                  ? [...selectedStudent.records]
                      .sort((a, b) => b.date.localeCompare(a.date))
                      .map(record => teacherRecordCard(selectedStudent, record))
                      .join("")
                  : emptyState("아직 작성한 기록이 없습니다.")
              }
            </div>
          </div>
        </div>
      `;
    }

    function teacherRecordCard(student, record) {
      const info = CATEGORY_INFO[record.category];

      return `
        <div class="record-card" data-category="${record.category}">
          <div class="record-meta">
            <span class="badge">${info.icon} ${info.name}</span>
            <span class="badge">${record.week}주차</span>
          </div>

          <h3>${escapeHtml(record.title)}</h3>
          <p>${escapeHtml(shorten(record.reflection || record.info, 130))}</p>

          <label for="feedback-${record.id}">교사 피드백</label>
          <textarea
            id="feedback-${record.id}"
            placeholder="구체적인 칭찬, 질문 또는 다음 탐색 방향을 입력하세요."
          >${escapeHtml(record.feedback || "")}</textarea>

          <button
            class="btn btn-teal"
            type="button"
            onclick="saveFeedback('${student.id}', '${record.id}')"
          >
            피드백 저장
          </button>
        </div>
      `;
    }

    function changeTeacherClass(classNumber) {
      const firstStudent = state.students.find(
        student => student.classNumber === Number(classNumber)
      );

      teacherSelectedStudentId = firstStudent.id;
      renderTeacherDashboard();
    }

    function selectTeacherStudent(studentId) {
      teacherSelectedStudentId = studentId;
      renderTeacherDashboard();
    }

    function saveFeedback(studentId, recordId) {
      const student = state.students.find(item => item.id === studentId);
      const record = student.records.find(item => item.id === recordId);

      record.feedback =
        document.getElementById(`feedback-${recordId}`).value.trim();

      saveState();
      showToast("학생에게 피드백을 저장했습니다.");
    }

    function resetStudentPassword(studentId) {
      if (!confirm("학생의 비밀번호를 1234로 초기화할까요?")) {
        return;
      }

      const student = state.students.find(item => item.id === studentId);
      student.password = "1234";
      saveState();

      showToast(`${student.name} 학생의 비밀번호를 1234로 초기화했습니다.`);
    }

    /* =====================================================
       12. 교사용 전체 학급 현황
       ===================================================== */
    function renderTeacherOverview() {
      setPageHeader(
        "📈 학급별 누적 현황",
        "5개 학급, 125명의 포트폴리오 작성 상황을 확인합니다."
      );

      const totalRecords = state.students.reduce(
        (sum, student) => sum + student.records.length,
        0
      );

      const activeStudents = state.students.filter(
        student => student.records.length > 0
      ).length;

      const noRecordStudents = state.students.length - activeStudents;

      const classRows = [1, 2, 3, 4, 5].map(classNumber => {
        const students = state.students.filter(
          student => student.classNumber === classNumber
        );

        const records = students.reduce(
          (sum, student) => sum + student.records.length,
          0
        );

        const writers = students.filter(
          student => student.records.length > 0
        ).length;

        return {
          classNumber,
          records,
          writers,
          noRecord: students.length - writers
        };
      });

      document.getElementById("viewContainer").innerHTML = `
        <div class="stats-grid">
          ${statCard("전체 학생", state.students.length, "total")}
          ${statCard("누적 기록", totalRecords, "job")}
          ${statCard("작성 학생", activeStudents, "major")}
          ${statCard("미작성 학생", noRecordStudents, "school")}
          ${statCard("운영 주차", 17, "activity")}
        </div>

        <div class="card">
          <h3>학급별 작성 현황</h3>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>학급</th>
                  <th>학생 수</th>
                  <th>작성 학생</th>
                  <th>미작성 학생</th>
                  <th>누적 기록</th>
                </tr>
              </thead>
              <tbody>
                ${classRows.map(row => `
                  <tr>
                    <td>1학년 ${row.classNumber}반</td>
                    <td>25명</td>
                    <td>${row.writers}명</td>
                    <td>${row.noRecord}명</td>
                    <td>${row.records}개</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =====================================================
       13. 데이터 내려받기
       ===================================================== */
    function exportMyData() {
      const student = getCurrentStudent();

      const exportData = {
        student: {
          id: student.id,
          name: student.name
        },
        exportedAt: new Date().toISOString(),
        records: student.records
      };

      const blob = new Blob(
        [JSON.stringify(exportData, null, 2)],
        { type: "application/json;charset=utf-8" }
      );

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${student.id}-진로포트폴리오.json`;
      link.click();

      URL.revokeObjectURL(link.href);
      showToast("내 기록 파일을 저장했습니다.");
    }

    /* =====================================================
       14. 공통 보조 기능
       ===================================================== */
    function goToView(view) {
      currentView = view;

      document
        .querySelectorAll(".nav-button[data-view]")
        .forEach(button => {
          button.classList.toggle("active", button.dataset.view === view);
        });

      renderCurrentView();
    }

    function emptyState(message) {
      return `
        <div class="empty-state">
          <div style="font-size:38px; margin-bottom:10px;">📝</div>
          <strong>${escapeHtml(message)}</strong>
        </div>
      `;
    }

    function shorten(text, length) {
      if (!text) return "";
      return text.length > length ? `${text.slice(0, length)}…` : text;
    }

    /* 사용자 입력을 화면에 안전하게 표시하기 위한 처리입니다. */
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatText(value) {
      return escapeHtml(value).replaceAll("\n", "<br>");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 2600);
    }

    /* 모달 바깥 영역을 누르면 창을 닫습니다. */
    document.getElementById("recordModal").addEventListener("click", event => {
      if (event.target.id === "recordModal") {
        closeRecordModal();
      }
    });
  </script>
</body>
</html>
